services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: retro_test
      POSTGRES_USER: retro_test
      POSTGRES_PASSWORD: local-retro-test-only
    ports:
      - "127.0.0.1:56392:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro_test -d retro_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  minio:
    # Supply a maintained/self-built image or use an existing local cache for disposable tests.
    image: ${RETRO_TEST_MINIO_IMAGE:-minio/minio:latest}
    pull_policy: never
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: retro-local-test
      MINIO_ROOT_PASSWORD: local-retro-minio-test-only
    ports:
      - "127.0.0.1:59002:9000"
